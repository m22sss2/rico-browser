// Rico Browser local new-tab configuration.
try {
  // Apply these defaults after Gecko's packaged preferences have loaded.
  defaultPref("dom.ipc.processPrelaunch.enabled", false);
  defaultPref("browser.newtab.preload", false);
  defaultPref("browser.tabs.unloadOnLowMemory", true);
  const interfaces = Components.interfaces;
  Services.obs.addObserver(window => {
    try {
      const taskbar = Components.classes["@mozilla.org/windows-taskbar;1"]
        .getService(interfaces.nsIWinTaskbar);
      const windows = Components.classes["@mozilla.org/windows-ui-utils;1"]
        .getService(interfaces.nsIWindowsUIUtils);
      const { PrivateBrowsingUtils } = ChromeUtils.importESModule(
        "resource://gre/modules/PrivateBrowsingUtils.sys.mjs");
      taskbar.setGroupIdForWindow(window, PrivateBrowsingUtils.isWindowPrivate(window)
        ? "RicoBrowser.Private" : "RicoBrowser.Desktop");
      const launcher = Services.dirsvc.get("GreD", interfaces.nsIFile).parent;
      launcher.append("rico.exe");
      windows.setWindowIconFromExe(window, launcher.path, 0);
    } catch (error) {
      Components.utils.reportError(error);
    }
  }, "browser-delayed-startup-finished");

  const { AboutNewTab } = ChromeUtils.importESModule("resource:///modules/AboutNewTab.sys.mjs");
  const home = Services.dirsvc.get("GreD", Components.interfaces.nsIFile).parent;
  home.append("assets");
  home.append("home.html");
  if (home.exists() && home.isFile()) {
    const homeURL = Services.io.newFileURI(home).spec;
    AboutNewTab.newTabURL = homeURL;
    const resources = Services.io.getProtocolHandler("resource")
      .QueryInterface(Components.interfaces.nsIResProtocolHandler);
    const assets = home.parent;
    const modules = assets.clone();
    modules.append("modules");
    resources.setSubstitution("rico", Services.io.newFileURI(modules));
    resources.setSubstitution("rico-assets", Services.io.newFileURI(assets));
    const theme = ChromeUtils.importESModule("resource://rico/RicoTheme.sys.mjs");
    const apply = window => theme.applyTheme(window.document, theme.readTheme());
    Services.obs.addObserver(apply, "browser-delayed-startup-finished");
    Services.prefs.addObserver(theme.themePref, () => {
      for (const window of Services.wm.getEnumerator("navigator:browser")) apply(window);
    });
    const artwork = assets.clone();
    artwork.append("rico-mascots.manifest");
    if (artwork.isFile()) {
      Components.manager.QueryInterface(interfaces.nsIComponentRegistrar).autoRegister(artwork);
    }
    try {
      const { registerRicoBranding } = ChromeUtils.importESModule("resource://rico/RicoBranding.sys.mjs");
      registerRicoBranding(assets);
    } catch (error) {
      Components.utils.reportError(error);
    }
    ChromeUtils.registerWindowActor("RicoSearch", {
      matches: [homeURL],
      parent: { esModuleURI: "resource://rico/RicoSearchParent.sys.mjs" },
      child: {
        esModuleURI: "resource://rico/RicoSearchChild.sys.mjs",
        events: { pageshow: {}, pagehide: {} },
      },
    });
    ChromeUtils.registerWindowActor("RicoSettings", {
      matches: ["about:preferences*"],
      includeChrome: true,
      child: {
        esModuleURI: "resource://rico/RicoSettingsChild.sys.mjs",
        events: { pageshow: {} },
      },
    });
  }
} catch (error) {
  Components.utils.reportError(error);
}
